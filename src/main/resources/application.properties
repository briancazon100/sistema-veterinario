# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# IMPORTANTE: Como ya creaste la DB, usamos 'update' (o 'none').
# Si usas 'create' o 'create-drop', te va a borrar las tablas cada vez que inicies.
spring.jpa.hibernate.ddl-auto=update
